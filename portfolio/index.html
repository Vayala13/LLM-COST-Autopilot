<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Build Log — Portfolio</title>
<style>
  :root {
    --bg: #0b0d10;
    --bg-soft: #12151a;
    --card: #161a20;
    --ink: #eef1f5;
    --muted: #8b95a3;
    --line: #232a33;
    --line-strong: #313b47;
    --accent: #4ade80;
    --accent-dim: #1f6f43;
    --amber: #fbbf24;
    --font-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-mono: ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background:
      radial-gradient(1200px 600px at 80% -10%, rgba(74,222,128,0.06), transparent),
      var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
  }

  a { color: inherit; }

  .wrap {
    max-width: 1000px;
    margin: 0 auto;
    padding: 0 1.5rem 5rem;
  }

  /* ---------- Header ---------- */
  header.masthead {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 1.5rem;
    padding: 3rem 0 2rem;
    border-bottom: 1px solid var(--line);
    flex-wrap: wrap;
  }

  .who {
    font-family: var(--font-mono);
    font-size: 0.75rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 0.7rem;
  }

  h1.name {
    font-size: clamp(2rem, 5vw, 3.1rem);
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1;
    margin: 0;
  }

  .tagline {
    color: var(--muted);
    font-size: 0.95rem;
    margin: 0.8rem 0 0;
    max-width: 48ch;
    line-height: 1.6;
  }

  .contact {
    font-family: var(--font-mono);
    font-size: 0.8rem;
    color: var(--muted);
    text-align: right;
    line-height: 1.9;
  }
  .contact a { text-decoration: none; border-bottom: 1px solid var(--line-strong); }
  .contact a:hover { color: var(--accent); }

  /* ---------- Project tabs ---------- */
  .tabs {
    display: flex;
    gap: 0.5rem;
    margin: 2rem 0 0;
    flex-wrap: wrap;
  }

  .tab {
    font-family: var(--font-mono);
    font-size: 0.8rem;
    padding: 0.6rem 1rem;
    background: var(--bg-soft);
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s ease;
    display: flex;
    align-items: center;
    gap: 0.55rem;
  }
  .tab:hover { border-color: var(--line-strong); color: var(--ink); }
  .tab.active {
    background: var(--card);
    border-color: var(--accent-dim);
    color: var(--ink);
  }
  .tab .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--muted);
  }
  .tab.active .dot { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  .tab .idx { color: var(--muted); font-size: 0.7rem; }

  /* ---------- Project panel ---------- */
  .panel { display: none; padding-top: 2.5rem; }
  .panel.active { display: block; }

  .project-head { margin-bottom: 2rem; }
  .project-title {
    font-size: 1.9rem;
    font-weight: 800;
    letter-spacing: -0.01em;
    margin: 0 0 0.6rem;
  }
  .project-blurb {
    color: var(--muted);
    line-height: 1.7;
    max-width: 64ch;
    margin: 0 0 1.2rem;
  }
  .stack { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 0.4rem; }
  .chip {
    font-family: var(--font-mono);
    font-size: 0.68rem;
    padding: 0.28rem 0.55rem;
    border: 1px solid var(--line-strong);
    border-radius: 5px;
    color: var(--muted);
  }
  .repo-link {
    font-family: var(--font-mono);
    font-size: 0.78rem;
    color: var(--accent);
    text-decoration: none;
    display: inline-block;
    margin-top: 0.8rem;
  }
  .repo-link:hover { text-decoration: underline; }

  /* ---------- Phase tracker ---------- */
  .section-label {
    font-family: var(--font-mono);
    font-size: 0.68rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 2.5rem 0 1rem;
  }

  .progress-bar {
    height: 6px;
    background: var(--bg-soft);
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 1.4rem;
    border: 1px solid var(--line);
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent-dim), var(--accent));
    transition: width 0.4s ease;
  }

  .phases { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 0.6rem; }
  .phase {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 0.85rem 0.9rem;
  }
  .phase.done { border-color: var(--accent-dim); }
  .phase.wip { border-color: var(--amber); }
  .phase-num { font-family: var(--font-mono); font-size: 0.66rem; color: var(--muted); }
  .phase-name { font-size: 0.86rem; font-weight: 600; margin: 0.3rem 0; line-height: 1.25; }
  .phase-status {
    font-family: var(--font-mono);
    font-size: 0.64rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .phase.done .phase-status { color: var(--accent); }
  .phase.wip .phase-status { color: var(--amber); }

  /* ---------- Stats ---------- */
  .stats { display: flex; gap: 2rem; margin: 1.2rem 0 0; flex-wrap: wrap; }
  .stat-num { font-family: var(--font-mono); font-size: 1.5rem; font-weight: 700; }
  .stat-label { font-size: 0.72rem; color: var(--muted); }

  /* ---------- Timeline / log ---------- */
  .timeline { position: relative; margin-top: 1rem; }
  .log-entry {
    display: grid;
    grid-template-columns: 7.5rem 1fr;
    column-gap: 1.5rem;
    padding: 0 0 2.25rem;
    border-bottom: 1px solid var(--line);
    margin-bottom: 2.25rem;
  }
  .log-entry:last-child {
    border-bottom: none;
    margin-bottom: 0;
    padding-bottom: 0;
  }
  .log-date {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
    padding-top: 0.35rem;
    white-space: nowrap;
  }
  .log-main { min-width: 0; }

  /* Friend-style outline badge: thin border, transparent fill, all-caps mono */
  .kicker {
    display: inline-block;
    font-family: var(--font-mono);
    font-size: 0.62rem;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 0.28rem 0.55rem;
    border-radius: 3px;
    margin: 0 0 0.75rem;
    border: 1px solid rgba(238, 241, 245, 0.55);
    background: transparent;
    color: var(--ink);
  }
  .kicker.tried { border-color: rgba(238, 241, 245, 0.55); color: var(--ink); }
  .kicker.started { border-color: rgba(238, 241, 245, 0.55); color: var(--ink); }

  .log-title {
    font-size: 1.35rem;
    font-weight: 700;
    letter-spacing: -0.015em;
    margin: 0 0 0.75rem;
    line-height: 1.25;
  }
  .log-body { color: #c4ccd6; font-size: 0.92rem; line-height: 1.7; max-width: 64ch; }
  .log-body p { margin: 0 0 0.75rem; }
  .log-body ul { padding-left: 1.1rem; margin: 0.6rem 0; }
  .log-body li { margin-bottom: 0.4rem; }
  .log-body code {
    font-family: var(--font-mono);
    font-size: 0.85em;
    background: var(--bg-soft);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 0.05em 0.35em;
  }

  footer {
    margin-top: 3rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--line);
    font-family: var(--font-mono);
    font-size: 0.72rem;
    color: var(--muted);
    display: flex;
    justify-content: space-between;
  }

  @media (max-width: 640px) {
    header.masthead { flex-direction: column; align-items: flex-start; }
    .contact { text-align: left; }
    .log-entry {
      grid-template-columns: 1fr;
      row-gap: 0.4rem;
    }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <div>
      <p class="who" id="who">Your Name — Build Log</p>
      <h1 class="name">Logged as I build.</h1>
      <p class="tagline">A running record of three projects — what I tried, what shipped, what broke. Updated as each phase lands.</p>
    </div>
    <div class="contact" id="contact">
      <a href="mailto:you@example.com">you@example.com</a><br>
      <a href="#" target="_blank">github.com/you</a>
    </div>
  </header>

  <nav class="tabs" id="tabs"></nav>

  <main id="panels"></main>

  <footer>
    <span>LOGGED AS I BUILD</span>
    <span>&copy; 2026</span>
  </footer>
</div>

<script>
/* =====================================================================
   EDIT HERE. This is the only part you touch to update your log.
   - Add a new entry to a project's `log` array (newest first).
   - Flip a phase `status` to "done" / "wip" / "planned".
   - kicker options: "tried" → TRIED THIS  |  "started" → STARTED MY COOL THING
   ===================================================================== */
const KICKER_LABEL = {
  tried: "Tried this",
  started: "Started my cool thing"
};

const OWNER = {
  name: "Your Name",
  email: "you@example.com",
  github: "https://github.com/you"
};

const PROJECTS = [
  {
    id: "llm-cost-autopilot",
    name: "LLM Cost AutoPilot",
    blurb: "Intelligent LLM routing: cheapest capable model per prompt, async quality verify + escalation, classifier feedback flywheel. Portfolio headline: reduced API costs by 30.6% vs all GPT-4o (offline load test, n=750). Case study: ../CASE_STUDY.md",
    stack: ["Python", "Anthropic", "OpenAI", "Ollama", "FastAPI", "scikit-learn", "SQLite", "Streamlit", "Docker"],
    repo: "https://github.com/Vayala13/LLM-COST-Autopilot",
    phases: [
      { name: "Unified Model Interface", status: "done" },
      { name: "Complexity Classifier", status: "done" },
      { name: "Async Quality Verification", status: "done" },
      { name: "Logging & Cost Dashboard", status: "done" },
      { name: "Expose as an API", status: "done" },
      { name: "Portfolio Polish", status: "done" }
    ],
    log: [
      {
        date: "AUG 02 2026",
        kicker: "tried",
        title: "Phase 6.2 — case study: 30.6% cost cut vs all GPT-4o",
        body: `<p>Wrote the portfolio case study that leads with the load-test headline and explains routing + the quality feedback loop.</p>
          <ul>
            <li>Headline: <strong>30.6%</strong> cheaper than all-GPT-4o (n=750 offline; see <code>reports/load_test_savings.md</code>).</li>
            <li>Documented tier→model map, async verify / escalate, and classifier retrain flywheel.</li>
            <li>Quality framing: escalation rate <code>3.2%</code> in the harness (~96.8% stayed on the cheap route).</li>
            <li>Ship artifact: <code>CASE_STUDY.md</code> (linked from README).</li>
          </ul>
          <p>All six build phases are complete.</p>`
      },
      {
        date: "AUG 02 2026",
        kicker: "tried",
        title: "Phase 6.1 — load test (n=750) → 30.6% vs GPT-4o",
        body: `<p>Ran an offline load test through the real classifier + routing map with mocked provider costs from the registry.</p>
          <ul>
            <li>750 prompts → audit rows + <code>reports/load_test_savings.{json,md}</code> + dashboard PNG.</li>
            <li>Routing mix: 56.7% llama-local, 28.7% gemini-flash, 14.7% claude-sonnet.</li>
          </ul>`
      },
      {
        date: "AUG 02 2026",
        kicker: "tried",
        title: "Phase 4.3 — money-shot cost reduction % vs all GPT-4o",
        body: `<p>Made the portfolio headline unmistakable: percent cost reduction versus sending every request to GPT-4o.</p>
          <ul>
            <li>Exposed <code>cost_reduction_pct</code> on the metrics summary (alias of savings %).</li>
            <li>Dashboard hero is the large % + dollars saved + “vs all GPT-4o” baseline.</li>
            <li>CLI: <code>PYTHONPATH=. python -m scripts.show_savings --demo</code> prints the number offline.</li>
          </ul>
          <p>Phase 4 (logging + cost dashboard) is complete. Next is the FastAPI completions endpoint.</p>`
      },
      {
        date: "JUL 31 2026",
        kicker: "tried",
        title: "Phase 2.3 — logistic regression vs random forest for tier routing",
        body: `<p>Trained two scikit-learn models on 201 labeled prompts / 11 features and kept a stratified holdout so I wasn't grading on the training set.</p>
          <ul>
            <li>Both logistic regression and random forest hit <code>88.2%</code> held-out accuracy (target &gt;80%).</li>
            <li>On a tie I kept logistic regression — simpler for a V1 routing skeleton.</li>
            <li>Saved the winner to <code>models/complexity_classifier.joblib</code> and metrics to <code>data/classifier_metrics.json</code>.</li>
            <li>Wired <code>predict_tier</code> so Phase 2.4 can map a prompt → cheapest capable model.</li>
          </ul>
          <p>Next up was the YAML routing map (Tier 1 → local Llama, Tier 2 → Gemini Flash, Tier 3 → Claude Sonnet).</p>`
      },
      {
        date: "JUL 23 2026",
        kicker: "started",
        title: "Foundation — secrets, config, and a working environment",
        body: `<p>Before any model logic, I laid the groundwork so the rest of the project has a stable base to build into.</p>
          <ul>
            <li>Created <code>.env</code> for the Anthropic API key and a <code>.gitignore</code> so secrets never hit GitHub.</li>
            <li>Wrote <code>config.py</code> that loads <code>.env</code> and exposes <code>ANTHROPIC_API_KEY</code> to every module.</li>
            <li>Debugged a real snag: system Python was 3.14 (externally managed) while pip installed into 3.9 — fixed by creating a <code>.venv</code>. Verified the key loads.</li>
            <li>Kept a personal <code>NOTES.local.md</code> (git-ignored) to track what each piece does.</li>
          </ul>
          <p>No routing yet — this is the foundation the 6 phases get built into.</p>`
      }
    ]
  },
  {
    id: "project-two",
    name: "Project Two",
    blurb: "Placeholder — swap in your second project's one-line description here.",
    stack: ["TBD"],
    repo: "https://github.com/you/project-two",
    phases: [
      { name: "Phase 1", status: "planned" },
      { name: "Phase 2", status: "planned" },
      { name: "Phase 3", status: "planned" }
    ],
    log: [
      { date: "TBD", kicker: "started", title: "Not started yet", body: "<p>Add your first log entry when you begin.</p>" }
    ]
  },
  {
    id: "project-three",
    name: "Project Three",
    blurb: "Placeholder — swap in your third project's one-line description here.",
    stack: ["TBD"],
    repo: "https://github.com/you/project-three",
    phases: [
      { name: "Phase 1", status: "planned" },
      { name: "Phase 2", status: "planned" },
      { name: "Phase 3", status: "planned" }
    ],
    log: [
      { date: "TBD", kicker: "started", title: "Not started yet", body: "<p>Add your first log entry when you begin.</p>" }
    ]
  }
];
/* ===================== END EDIT ZONE ===================== */

const STATUS_LABEL = { done: "Done", wip: "In progress", planned: "Planned" };

function renderOwner() {
  document.getElementById("who").textContent = OWNER.name + " — Build Log";
  document.getElementById("contact").innerHTML =
    `<a href="mailto:${OWNER.email}">${OWNER.email}</a><br>` +
    `<a href="${OWNER.github}" target="_blank" rel="noopener">${OWNER.github.replace(/^https?:\/\//, "")}</a>`;
}

function phaseTracker(p) {
  const done = p.phases.filter(x => x.status === "done").length;
  const pct = Math.round((done / p.phases.length) * 100);
  const cards = p.phases.map((ph, i) => `
    <div class="phase ${ph.status}">
      <div class="phase-num">${String(i + 1).padStart(2, "0")}</div>
      <div class="phase-name">${ph.name}</div>
      <div class="phase-status">${STATUS_LABEL[ph.status] || ph.status}</div>
    </div>`).join("");
  return `
    <p class="section-label">Phases — ${done}/${p.phases.length} complete</p>
    <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="phases">${cards}</div>`;
}

function timeline(p) {
  const entries = p.log.map(e => `
    <article class="log-entry">
      <div class="log-date">${e.date}</div>
      <div class="log-main">
        <span class="kicker ${e.kicker}">${KICKER_LABEL[e.kicker] || e.kicker}</span>
        <h3 class="log-title">${e.title}</h3>
        <div class="log-body">${e.body}</div>
      </div>
    </article>`).join("");
  return `<p class="section-label">Devlog</p><div class="timeline">${entries}</div>`;
}

function renderPanels() {
  const tabs = document.getElementById("tabs");
  const panels = document.getElementById("panels");
  tabs.innerHTML = PROJECTS.map((p, i) => `
    <button class="tab ${i === 0 ? "active" : ""}" data-i="${i}">
      <span class="dot"></span>${p.name}<span class="idx">0${i + 1}</span>
    </button>`).join("");

  panels.innerHTML = PROJECTS.map((p, i) => `
    <section class="panel ${i === 0 ? "active" : ""}" data-i="${i}">
      <div class="project-head">
        <h2 class="project-title">${p.name}</h2>
        <p class="project-blurb">${p.blurb}</p>
        <div class="stack">${p.stack.map(s => `<span class="chip">${s}</span>`).join("")}</div>
        <a class="repo-link" href="${p.repo}" target="_blank" rel="noopener">${p.repo.replace(/^https?:\/\//, "")} &#8599;</a>
      </div>
      ${phaseTracker(p)}
      <div class="stats">
        <div><div class="stat-num">${p.log.length}</div><div class="stat-label">Entries logged</div></div>
        <div><div class="stat-num">${p.phases.filter(x => x.status === "done").length}/${p.phases.length}</div><div class="stat-label">Phases done</div></div>
      </div>
      ${timeline(p)}
    </section>`).join("");

  tabs.querySelectorAll(".tab").forEach(btn => {
    btn.addEventListener("click", () => {
      const i = btn.dataset.i;
      tabs.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.i === i));
      panels.querySelectorAll(".panel").forEach(pn => pn.classList.toggle("active", pn.dataset.i === i));
    });
  });
}

renderOwner();
renderPanels();
</script>
</body>
</html>
